[package]
name = "screencue-listen"
version = "0.0.4"
edition = "2021"
license = "MIT"
description = "Optional native audio and speaking-notes helper for ScreenCue"
repository = "https://github.com/CrioNIK/ScreenCue"

[dependencies]
base64 = "0.22"
cpal = "0.18.2"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
