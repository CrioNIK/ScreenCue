[package]
name = "screencue"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Small, click-through desktop hints for any MCP agent"
repository = "https://github.com/CrioNIK/ScreenCue"

[dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"
fontdue = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
