name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            binary: screencue.exe
          - os: macos-latest
            artifact: macos
            binary: screencue
          - os: ubuntu-latest
            artifact: linux-x11
            binary: screencue
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxrandr-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Unit tests
        run: cargo +stable test --locked
      - name: Release build
        run: cargo +stable build --release --locked
      - name: Package binary and licenses
        run: |
          mkdir -p package/licenses
          cp "target/release/${{ matrix.binary }}" package/
          cp LICENSE package/
          cp assets/OFL.txt package/licenses/IBM-Plex-Mono-OFL.txt
          cp README.md package/
          tar -czf "screencue-${{ matrix.artifact }}.tar.gz" -C package .
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: screencue-${{ matrix.artifact }}
          path: screencue-${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14
